<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Planner - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fefefe, #f5f5f5);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      margin-bottom: 1rem;
    }

    header img {
      width: 80px;
      height: auto;
    }

    h1 {
      font-size: 2rem;
      color: #ff4f8b;
    }

    p {
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
      color: #555;
    }

    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      background: #ff4f8b;
      color: white;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #e13d75;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Time Planner Logo" />
  </header>

  <main>
    <h1>Welcome to Time Planner</h1>
    <p>Organize all your <strong>tasks</strong>, <strong>meetings</strong>, and <strong>habits</strong> in one place. 
       Stay productive and keep your day in check.</p>
    <a href="#" class="btn">Get Started</a>
  </main>
</body>
</html>
