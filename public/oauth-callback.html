<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Completing Authentication...</h2>
        <p id="status">Processing OAuth callback...</p>
    </div>

    <script>
        (function() {
            console.log('🔄 OAuth callback page loaded');
            
            const statusElement = document.getElementById('status');
            
            try {
                // Get the hash fragment from the URL
                const hash = window.location.hash;
                console.log('Hash fragment:', hash);
                
                if (!hash) {
                    throw new Error('No hash fragment found in URL');
                }
                
                // Parse the hash parameters
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const error = params.get('error');
                const errorDescription = params.get('error_description');
                const state = params.get('state');
                
                console.log('Parsed parameters:', {
                    hasToken: !!accessToken,
                    error: error,
                    state: state
                });
                
                if (error) {
                    console.error('❌ OAuth error:', error, errorDescription);
                    statusElement.textContent = `Authentication failed: ${error}`;
                    statusElement.className = 'error';
                    
                    // Send error message to parent window
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'OAUTH_ERROR',
                            error: error,
                            errorDescription: errorDescription
                        }, window.location.origin);
                    }
                    
                    // Close popup after 3 seconds
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                    
                } else if (accessToken) {
                    console.log('✅ Access token received successfully');
                    statusElement.textContent = 'Authentication successful! Closing window...';
                    statusElement.className = 'success';
                    
                    // Send success message to parent window
                    if (window.opener) {
                        console.log('📤 Sending token to parent window');
                        window.opener.postMessage({
                            type: 'OAUTH_SUCCESS',
                            token: accessToken,
                            returnedState: state
                        }, window.location.origin);
                    } else {
                        console.warn('⚠️ No opener window found');
                    }
                    
                    // Close popup after a short delay
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                    
                } else {
                    throw new Error('No access token or error found in callback');
                }
                
            } catch (err) {
                console.error('❌ Error processing OAuth callback:', err);
                statusElement.textContent = `Error: ${err.message}`;
                statusElement.className = 'error';
                
                // Send error to parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'OAUTH_ERROR',
                        error: 'callback_processing_error',
                        errorDescription: err.message
                    }, window.location.origin);
                }
                
                // Close popup after 5 seconds on error
                setTimeout(() => {
                    window.close();
                }, 5000);
            }
        })();
    </script>
