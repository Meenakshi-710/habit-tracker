<!DOCTYPE html>
<html>
<head>
  <title>OAuth Redirect</title>
</head>
<body>
  <script>
    // Send OAuth data to your extension
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code'); // or token, depending on your flow

    if (code) {
      // Send to extension
      chrome.runtime.sendMessage(
        '<YOUR_EXTENSION_ID>', // Replace with your current dev ID
        { type: 'oauth2_code', code }
      );
    }

    // Optional: Close the page automatically
    window.close();
  </script>
</body>
</html>
