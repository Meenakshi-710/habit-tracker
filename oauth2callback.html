<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OAuth Callback</title>
</head>
<body>
  <script>
    window.onload = function() {
      const hash = window.location.hash;
      if (hash) {
        window.opener.postMessage(hash, '*');
        window.close();
      }
    };
  </script>
</body>
</html>
